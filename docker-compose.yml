services:
  postgres:
    image: postgres:16-alpine
    container_name: vms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vms_admin
      POSTGRES_PASSWORD: vms_password
      POSTGRES_DB: vms_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vms_network

  redis:
    image: redis:7-alpine
    container_name: vms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vms_network

volumes:
  postgres_data:
  redis_data:

networks:
  vms_network:
    driver: bridge
