<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#f05d49" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#f05d49" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Host Alert</text>
    <text x="70" y="48" fill="#f05d49" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">NORMAL VISITOR &#183; STEP 4</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 190)">
    <rect width="668" height="1400" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="40" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="32">Instant Host Doorbell</text>
    <text x="40" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="19">Host notified in 1.2s via Slack, WhatsApp &amp; Mobile Push.</text>

    <!-- Simulated Slack App Notification Card -->
    <rect x="40" y="160" width="588" height="460" rx="24" fill="#1e1e24" stroke="#4a154b" stroke-width="2"/>
    
    <!-- Slack Channel Header -->
    <rect x="40" y="160" width="588" height="70" rx="24" fill="#350d36"/>
    <text x="70" y="204" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22"># security-arrivals</text>
    <text x="500" y="204" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="16">VMS APP</text>

    <!-- Slack Message Body -->
    <circle cx="85" cy="285" r="25" fill="#f05d49"/>
    <text x="75" y="293" fill="#fff" font-family="'Inter', sans-serif" font-weight="800" font-size="20">V</text>
    
    <text x="125" y="275" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22">VMS Arrival Bot</text>
    <text x="300" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">09:21 AM</text>
    
    <text x="125" y="315" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="20">&#128075; <tspan font-weight="bold">Akhil Sharma</tspan> has arrived at the Main Lobby.</text>
    <text x="125" y="348" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Purpose: Architecture Strategy Review</text>
    <text x="125" y="375" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Selfie verified &#183; Waiting at Gate 1</text>

    <!-- Slack Interactive Buttons -->
    <rect x="125" y="420" width="220" height="60" rx="14" fill="#007a5a"/>
    <text x="150" y="458" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="18">&#10003; Approve Pass</text>

    <rect x="365" y="420" width="220" height="60" rx="14" fill="#2c3136" stroke="#475569"/>
    <text x="390" y="458" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="18">Down in 5 mins</text>

    <rect x="125" y="500" width="460" height="54" rx="14" fill="#2c3136" stroke="#475569"/>
    <text x="190" y="534" fill="#f87171" font-family="'Inter', sans-serif" font-weight="600" font-size="17">&#10007; Decline / Not Available</text>

    <!-- Notification Speed Banner -->
    <rect x="40" y="680" width="588" height="150" rx="20" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
    <text x="70" y="725" fill="#22c55e" font-family="'Inter', sans-serif" font-weight="800" font-size="22">&#9679; ZERO RECEPTION INTERMEDIARY</text>
    <text x="70" y="760" fill="#ffffff" font-family="'Inter', sans-serif" font-size="19">Guard station receives host approval token instantly.</text>
    <text x="70" y="795" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">No calling extensions or walking to desks.</text>

    <!-- Status Banner -->
    <rect x="40" y="1240" width="588" height="96" rx="28" fill="url(#coralG)"/>
    <text x="190" y="1298" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Host Approved! View Pass &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>