<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#3b82f6" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Serial Inspection</text>
    <text x="70" y="48" fill="#3b82f6" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">IT VISITOR &#183; STEP 3</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 190)">
    <rect width="668" height="1400" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="40" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="32">Serial &amp; Photo Audit</text>
    <text x="40" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="19">Camera scans chassis barcode and logs tamper-evident seal.</text>

    <!-- Optical Scan Viewfinder -->
    <rect x="40" y="160" width="588" height="480" rx="24" fill="#0b101d" stroke="#3b82f6" stroke-width="2"/>
    
    <!-- Red Laser Barcode Line -->
    <line x1="60" y1="360" x2="608" y2="360" stroke="#f05d49" stroke-width="4"/>
    
    <!-- Simulated Barcode on laptop back -->
    <g transform="translate(184, 280)">
      <rect width="300" height="140" fill="#ffffff" rx="8"/>
      <!-- Barcode lines -->
      <line x1="20" y1="20" x2="20" y2="100" stroke="#000" stroke-width="4"/>
      <line x1="30" y1="20" x2="30" y2="100" stroke="#000" stroke-width="8"/>
      <line x1="45" y1="20" x2="45" y2="100" stroke="#000" stroke-width="3"/>
      <line x1="55" y1="20" x2="55" y2="100" stroke="#000" stroke-width="10"/>
      <line x1="75" y1="20" x2="75" y2="100" stroke="#000" stroke-width="5"/>
      <line x1="90" y1="20" x2="90" y2="100" stroke="#000" stroke-width="12"/>
      <line x1="115" y1="20" x2="115" y2="100" stroke="#000" stroke-width="6"/>
      <line x1="130" y1="20" x2="130" y2="100" stroke="#000" stroke-width="4"/>
      <line x1="145" y1="20" x2="145" y2="100" stroke="#000" stroke-width="10"/>
      <line x1="170" y1="20" x2="170" y2="100" stroke="#000" stroke-width="5"/>
      <line x1="190" y1="20" x2="190" y2="100" stroke="#000" stroke-width="8"/>
      <line x1="210" y1="20" x2="210" y2="100" stroke="#000" stroke-width="14"/>
      <line x1="240" y1="20" x2="240" y2="100" stroke="#000" stroke-width="4"/>
      <line x1="260" y1="20" x2="260" y2="100" stroke="#000" stroke-width="8"/>
      <text x="70" y="125" fill="#000" font-family="monospace" font-weight="bold" font-size="16">PF-3K9820-L</text>
    </g>

    <!-- Scan Match Banner -->
    <rect x="40" y="680" width="588" height="150" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="85" cy="755" r="24" fill="#10b981"/>
    <path d="M75 755 L82 762 L95 748" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="130" y="745" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">Serial Matched 100%</text>
    <text x="130" y="775" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="17">PF-3K9820-L cryptographically bound to pass</text>

    <!-- RFID Label Stamp -->
    <rect x="40" y="860" width="588" height="160" rx="20" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="905" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Tamper-Evident Security Seal</text>
    <text x="70" y="940" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">Optical RFID tag #88392 affixed to device chassis.</text>
    <text x="70" y="975" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="16">&#10003; Port physical blockers verified on USB/Thunderbolt</text>

    <rect x="40" y="1240" width="588" height="96" rx="28" fill="url(#blueG)"/>
    <text x="180" y="1298" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Next: Pre-Approval &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>