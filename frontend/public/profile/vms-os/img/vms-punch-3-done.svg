<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="indigoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="emeraldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Status Bar -->
  <g transform="translate(48, 40)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="20">09:21</text>
    <g transform="translate(600, 10)">
      <!-- Signal -->
      <rect x="0" y="8" width="5" height="12" rx="2" fill="#fff"/>
      <rect x="8" y="5" width="5" height="15" rx="2" fill="#fff"/>
      <rect x="16" y="2" width="5" height="18" rx="2" fill="#fff"/>
      <rect x="24" y="0" width="5" height="20" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="36" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="45" y="5" width="26" height="12" rx="3" fill="#10b981"/>
      <rect x="79" y="7" width="3" height="8" rx="1" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(48, 100)">
    <circle cx="24" cy="24" r="22" fill="#4f46e5"/>
    <path d="M16 24 L22 30 L32 18" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="24" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">Check-In Complete</text>
    <text x="60" y="44" fill="#818cf8" font-family="'Inter', sans-serif" font-weight="600" font-size="14" letter-spacing="1.5">VMS ENTERPRISE</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(48, 180)">
    <rect width="684" height="1380" rx="32" fill="#151d2c" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    
    <!-- Success Banner -->
    <g transform="translate(192, 80)">
      <circle cx="150" cy="150" r="110" fill="#064e3b" stroke="#10b981" stroke-width="6"/>
      <path d="M 105 150 L 138 185 L 200 115" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <g transform="translate(44, 400)">
      <text x="298" y="0" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="44" text-anchor="middle">Checked In!</text>
      <text x="298" y="44" fill="#10b981" font-family="'Inter', sans-serif" font-weight="700" font-size="24" text-anchor="middle">GATE IN TIME: 09:21 AM</text>
      <text x="298" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="20" text-anchor="middle">Gate 1 North &#183; Host Notified</text>
    </g>

    <!-- Summary Box -->
    <g transform="translate(44, 540)">
      <rect width="596" height="340" rx="28" fill="#1c2638"/>
      
      <g transform="translate(36, 40)">
        <text x="0" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">VISITOR NAME</text>
        <text x="0" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Rajesh Kumar</text>
      </g>

      <g transform="translate(330, 40)">
        <text x="0" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">HOST EMPLOYEE</text>
        <text x="0" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Akhil Sharma</text>
      </g>

      <line x1="36" y1="130" x2="560" y2="130" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

      <g transform="translate(36, 160)">
        <text x="0" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">PURPOSE OF VISIT</text>
        <text x="0" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="24">Client Architecture Review</text>
      </g>

      <g transform="translate(330, 160)">
        <text x="0" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">DECLARED ASSET</text>
        <text x="0" y="58" fill="#10b981" font-family="'Inter', sans-serif" font-weight="700" font-size="24">1 Laptop (Cleared)</text>
      </g>

      <g transform="translate(36, 260)">
        <rect width="524" height="50" rx="14" fill="#10b981" opacity="0.15"/>
        <text x="262" y="32" fill="#10b981" font-family="'Inter', sans-serif" font-weight="700" font-size="18" text-anchor="middle">✓ Host notified via Slack &amp; Email</text>
      </g>
    </g>

    <!-- Tap button -->
    <g transform="translate(44, 940)">
      <rect width="596" height="84" rx="24" fill="#4f46e5"/>
      <text x="298" y="52" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26" text-anchor="middle">View Digital Badge</text>
    </g>
  </g>


  <!-- Home Indicator -->
  <rect x="290" y="1640" width="200" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
</svg>