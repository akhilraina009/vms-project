<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#f05d49" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#f05d49" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Live Selfie</text>
    <text x="70" y="48" fill="#f05d49" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">NORMAL VISITOR &#183; STEP 3</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 190)">
    <rect width="668" height="1400" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="40" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="32">Biometric Verification</text>
    <text x="40" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="19">Position face inside frame for high-speed gate matching.</text>

    <!-- Circular Face Scanner Frame -->
    <g transform="translate(334, 430)">
      <circle r="220" fill="#0b101d" stroke="#334155" stroke-width="2"/>
      <circle r="210" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="16 10"/>
      <!-- Inner Target Reticle -->
      <circle r="160" fill="none" stroke="rgba(34, 197, 94, 0.4)" stroke-width="2"/>
      
      <!-- Stylized Avatar Silhouette -->
      <circle cy="-30" r="70" fill="#1e293b"/>
      <path d="M-110 130 C -110 50, 110 50, 110 130 Z" fill="#1e293b"/>
      
      <!-- Reticle Crosshairs -->
      <line x1="-240" y1="0" x2="-200" y2="0" stroke="#22c55e" stroke-width="4"/>
      <line x1="200" y1="0" x2="240" y2="0" stroke="#22c55e" stroke-width="4"/>
      <line x1="0" y1="-240" x2="0" y2="-200" stroke="#22c55e" stroke-width="4"/>
      <line x1="0" y1="200" x2="0" y2="240" stroke="#22c55e" stroke-width="4"/>

      <!-- Biometric Mesh Points -->
      <circle cx="-40" cy="-30" r="5" fill="#38bdf8"/>
      <circle cx="40" cy="-30" r="5" fill="#38bdf8"/>
      <circle cx="0" cy="10" r="5" fill="#38bdf8"/>
      <circle cx="-30" cy="50" r="5" fill="#38bdf8"/>
      <circle cx="30" cy="50" r="5" fill="#38bdf8"/>
    </g>

    <!-- Quality Check Status -->
    <rect x="84" y="730" width="500" height="84" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <circle cx="126" cy="772" r="18" fill="#10b981"/>
    <path d="M118 772 L124 778 L134 766" stroke="#fff" stroke-width="3" fill="none"/>
    <text x="160" y="766" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="20">AI Liveness Check: 99.8% Passed</text>
    <text x="160" y="792" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="15">Anti-spoofing verified &#183; Lighting optimal</text>

    <!-- Dossier Match Preview -->
    <rect x="40" y="860" width="588" height="180" rx="20" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="905" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22">Automated Security Dossier</text>
    <text x="70" y="938" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">Photo immediately syncs to Security Guardhouse Terminal &amp; Host Slack</text>
    <rect x="70" y="965" width="220" height="42" rx="12" fill="#0f172a"/>
    <text x="86" y="992" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="15">&#9679; Biometrics Encrypted</text>

    <!-- Shutter Action Button -->
    <rect x="40" y="1240" width="588" height="96" rx="28" fill="url(#greenG)"/>
    <text x="210" y="1298" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">&#10003; Confirm &amp; Submit</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>