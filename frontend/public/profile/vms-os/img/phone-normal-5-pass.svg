<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#f05d49" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#f05d49" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Digital Pass</text>
    <text x="70" y="48" fill="#f05d49" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">NORMAL VISITOR &#183; STEP 5</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 170)">
    <rect width="668" height="1420" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <!-- Pass Header Pill -->
    <rect x="194" y="30" width="280" height="44" rx="22" fill="#064e3b" stroke="#059669"/>
    <text x="214" y="58" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="16">&#9679; ACTIVE DIGITAL BADGE</text>

    <!-- Pass Card Container -->
    <rect x="40" y="95" width="588" height="740" rx="28" fill="#ffffff" filter="url(#softShadow)"/>

    <!-- Top Pass Color Banner -->
    <rect x="40" y="95" width="588" height="130" rx="28" fill="#0f172a"/>
    <rect x="40" y="190" width="588" height="35" fill="#0f172a"/>
    <text x="70" y="155" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="30">VMS ACCESS PASS</text>
    <text x="70" y="185" fill="#f05d49" font-family="'Inter', sans-serif" font-weight="700" font-size="15">AUTHORIZED VISITOR &#183; TIER 1</text>

    <!-- Visitor Photo & Details -->
    <circle cx="110" cy="290" r="45" fill="#e2e8f0" stroke="#f05d49" stroke-width="3"/>
    <text x="95" y="303" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="800" font-size="32">AS</text>

    <text x="180" y="275" fill="#0f172a" font-family="'Inter', sans-serif" font-weight="800" font-size="28">Akhil Sharma</text>
    <text x="180" y="306" fill="#64748b" font-family="'Inter', sans-serif" font-size="18">Visiting: <tspan font-weight="bold" fill="#0f172a">Rajesh Sharma</tspan></text>
    <text x="180" y="332" fill="#64748b" font-family="'Inter', sans-serif" font-size="16">Pass ID: <tspan font-family="monospace">VMS-99201</tspan></text>

    <!-- Glowing QR Code -->
    <g transform="translate(194, 390)">
      <rect width="280" height="280" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="25" y="25" width="70" height="70" fill="#0f172a"/>
      <rect x="40" y="40" width="40" height="40" fill="#ffffff"/>
      <rect x="48" y="48" width="24" height="24" fill="#0f172a"/>
      <rect x="185" y="25" width="70" height="70" fill="#0f172a"/>
      <rect x="200" y="40" width="40" height="40" fill="#ffffff"/>
      <rect x="208" y="48" width="24" height="24" fill="#0f172a"/>
      <rect x="25" y="185" width="70" height="70" fill="#0f172a"/>
      <rect x="40" y="200" width="40" height="40" fill="#ffffff"/>
      <rect x="48" y="208" width="24" height="24" fill="#0f172a"/>
      <!-- QR Interior matrix -->
      <rect x="125" y="30" width="30" height="50" fill="#0f172a"/>
      <rect x="125" y="115" width="40" height="40" fill="#f05d49"/>
      <rect x="35" y="125" width="55" height="30" fill="#0f172a"/>
      <rect x="195" y="125" width="55" height="30" fill="#0f172a"/>
      <rect x="125" y="185" width="30" height="60" fill="#0f172a"/>
      <rect x="185" y="185" width="40" height="40" fill="#0f172a"/>
    </g>

    <!-- Scan helper -->
    <text x="334" y="715" text-anchor="middle" fill="#64748b" font-family="'Inter', sans-serif" font-weight="600" font-size="16">Hold screen against turnstile optical scanner</text>

    <!-- Validity Details Section -->
    <rect x="40" y="870" width="588" height="150" rx="20" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="915" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="16">AUTHORIZED STAY WINDOW</text>
    <text x="70" y="955" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="28">09:21 AM &#8212; 06:00 PM</text>
    <text x="70" y="990" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="16">&#9679; Main Building &#183; Floors 1 through 5</text>

    <rect x="40" y="1250" width="588" height="96" rx="28" fill="url(#coralG)"/>
    <text x="210" y="1308" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Scan at Turnstile &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>