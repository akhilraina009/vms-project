<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#141a29"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#kbg)"/>
  
  <!-- Header -->
  <g transform="translate(60, 50)">
    <rect width="50" height="50" rx="14" fill="#4f46e5"/>
    <path d="M18 25 L23 30 L32 18" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="68" y="36" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="34">VMS RECEPTION KIOSK</text>
    <rect x="940" y="6" width="190" height="42" rx="21" fill="#1e293b"/>
    <circle cx="965" cy="27" r="8" fill="#10b981"/>
    <text x="985" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="18">KIOSK 01 &#183; ONLINE</text>
  </g>

  <!-- Left: QR Code Scan -->
  <g transform="translate(80, 160)">
    <rect width="480" height="560" rx="32" fill="#162032" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <text x="240" y="60" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="28" text-anchor="middle">Scan QR on Mobile</text>
    <text x="240" y="94" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">Open camera &amp; point to register visit</text>

    <!-- Big QR code -->
    <g transform="translate(115, 140)">
      <rect width="250" height="250" rx="24" fill="#ffffff"/>
      <!-- QR Blocks -->
      <rect x="20" y="20" width="60" height="60" rx="10" fill="#0f172a"/>
      <rect x="30" y="30" width="40" height="40" rx="6" fill="#ffffff"/>
      <rect x="170" y="20" width="60" height="60" rx="10" fill="#0f172a"/>
      <rect x="180" y="30" width="40" height="40" rx="6" fill="#ffffff"/>
      <rect x="20" y="170" width="60" height="60" rx="10" fill="#0f172a"/>
      <rect x="30" y="180" width="40" height="40" rx="6" fill="#ffffff"/>
      <circle cx="125" cy="125" r="22" fill="#4f46e5"/>
    </g>

    <rect x="50" y="440" width="380" height="64" rx="20" fill="#4f46e5"/>
    <text x="240" y="480" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22" text-anchor="middle">Scan to Self-Register</text>
  </g>

  <!-- Right: Facial Recognition / Camera Look -->
  <g transform="translate(640, 160)">
    <rect width="480" height="560" rx="32" fill="#162032" stroke="rgba(79,70,229,0.4)" stroke-width="2"/>
    <text x="240" y="60" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="28" text-anchor="middle">Expected Guest? Look Here</text>
    <text x="240" y="94" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18" text-anchor="middle">Instant 1-second face identification</text>

    <!-- Camera viewfinder -->
    <g transform="translate(90, 140)">
      <rect width="300" height="260" rx="28" fill="#0d1424" stroke="#10b981" stroke-width="3"/>
      <circle cx="150" cy="110" r="50" fill="#243047"/>
      <path d="M 90 230 C 90 180 120 160 150 160 C 180 160 210 180 210 230 Z" fill="#243047"/>
      <line x1="20" y1="130" x2="280" y2="130" stroke="#10b981" stroke-width="3" stroke-dasharray="8 4"/>
    </g>

    <rect x="50" y="440" width="380" height="64" rx="20" fill="#10b981"/>
    <text x="240" y="480" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22" text-anchor="middle">Tap to Check In by Face</text>
  </g>
</svg>