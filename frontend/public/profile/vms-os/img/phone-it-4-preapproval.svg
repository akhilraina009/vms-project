<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#3b82f6" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">IT Pre-Approval</text>
    <text x="70" y="48" fill="#3b82f6" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">IT VISITOR &#183; STEP 4</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 190)">
    <rect width="668" height="1400" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="40" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="32">Security Pre-Approval</text>
    <text x="40" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="19">Triple sign-off completed before technician reaches front gate.</text>

    <!-- Approval 1 -->
    <rect x="40" y="160" width="588" height="150" rx="20" fill="#0f172a" stroke="#10b981"/>
    <circle cx="85" cy="235" r="22" fill="#10b981"/>
    <path d="M75 235 L82 242 L95 228" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="130" y="215" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">1. Host Technical Sponsor</text>
    <text x="130" y="245" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="17">Rajesh Sharma (DevOps VP) &#183; Approved 08:30 AM</text>
    <text x="130" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15">Scope: Scheduled maintenance window approved</text>

    <!-- Approval 2 -->
    <rect x="40" y="340" width="588" height="150" rx="20" fill="#0f172a" stroke="#10b981"/>
    <circle cx="85" cy="415" r="22" fill="#10b981"/>
    <path d="M75 415 L82 422 L95 408" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="130" y="395" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">2. Datacenter Facilities Lead</text>
    <text x="130" y="425" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="17">Col. S. Verma (Head of Security) &#183; Approved 08:45 AM</text>
    <text x="130" y="455" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15">Access Zone: Server Room 4B, Row 12 Racks</text>

    <!-- Approval 3 -->
    <rect x="40" y="520" width="588" height="150" rx="20" fill="#0f172a" stroke="#10b981"/>
    <circle cx="85" cy="595" r="22" fill="#10b981"/>
    <path d="M75 595 L82 602 L95 588" stroke="#fff" stroke-width="4" fill="none"/>
    <text x="130" y="575" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">3. CISO Asset Policy Stamp</text>
    <text x="130" y="605" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="17">Sunita Rao (CISO) &#183; Approved 09:00 AM</text>
    <text x="130" y="635" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="15">Hardware Authorization: 2 Declared / 0 Uncleared</text>

    <!-- Ready Banner -->
    <rect x="40" y="710" width="588" height="120" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="755" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="22">&#10003; FAST-TRACK ARRIVAL READY</text>
    <text x="70" y="790" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="17">Gate 01 Guard Terminal primed for instantaneous clearance.</text>

    <rect x="40" y="1240" width="588" height="96" rx="28" fill="url(#blueG)"/>
    <text x="200" y="1298" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Next: Gate Match &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>