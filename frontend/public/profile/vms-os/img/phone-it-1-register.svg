<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#3b82f6" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Contractor Intake</text>
    <text x="70" y="48" fill="#3b82f6" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">IT VISITOR &#183; STEP 1</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 190)">
    <rect width="668" height="1400" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="40" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="32">Contractor Intake</text>
    <text x="40" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="19">Technical vendor intake for server room and datacenter engineers.</text>

    <!-- Contractor Badge Details -->
    <rect x="40" y="160" width="588" height="420" rx="24" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    
    <rect x="40" y="160" width="588" height="80" rx="24" fill="#1d4ed8"/>
    <text x="70" y="210" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="24">IT TECHNICAL CLEARANCE</text>
    
    <text x="70" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">CONTRACTOR NAME</text>
    <text x="70" y="325" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="26">Amit Verma</text>

    <text x="70" y="380" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">ORGANIZATION / VENDOR</text>
    <text x="70" y="415" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22">Wipro Datacenter Infrastructure Ops</text>

    <text x="70" y="470" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">GOVT ID / AADHAAR VERIFICATION</text>
    <text x="70" y="505" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="20">&#10003; ID Digitally Matched (Biometric Stored)</text>

    <!-- Scope of Work -->
    <rect x="40" y="620" width="588" height="240" rx="24" fill="#141c2e" stroke="#25354e"/>
    <text x="70" y="670" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22">Technical Scope &amp; Target Zone</text>
    <text x="70" y="710" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="18">Target: Server Room 4B &#183; Racks 12-A through 12-D</text>
    <text x="70" y="745" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="17">Scope: Fiber Switch Replacement &amp; Patch Panel Audit</text>
    <text x="70" y="790" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="16">Escort Required: Level 2 Infrastructure Lead</text>

    <rect x="40" y="1240" width="588" height="96" rx="28" fill="url(#blueG)"/>
    <text x="180" y="1298" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Next: Hardware Declaration &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>