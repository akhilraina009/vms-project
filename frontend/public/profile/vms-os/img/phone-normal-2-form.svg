<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#f05d49" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#f05d49" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Guest Details</text>
    <text x="70" y="48" fill="#f05d49" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">NORMAL VISITOR &#183; STEP 2</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 190)">
    <rect width="668" height="1400" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>

    <text x="40" y="60" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="32">Guest Information</text>
    <text x="40" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="19">Takes only 20 seconds. Return guests are remembered.</text>

    <!-- Input 1: Full Name -->
    <text x="40" y="160" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="18">FULL NAME</text>
    <rect x="40" y="180" width="588" height="84" rx="18" fill="#0f172a" stroke="#f05d49" stroke-width="2"/>
    <text x="64" y="232" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="24">Akhil Sharma</text>

    <!-- Input 2: Mobile -->
    <text x="40" y="310" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="18">MOBILE NUMBER</text>
    <rect x="40" y="330" width="588" height="84" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="64" y="382" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22">+91 98765 43210</text>
    <rect x="520" y="348" width="88" height="48" rx="12" fill="#064e3b"/>
    <text x="536" y="378" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="16">OTP &#10003;</text>

    <!-- Input 3: Host Search -->
    <text x="40" y="460" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="18">HOST EMPLOYEE TO VISIT</text>
    <rect x="40" y="480" width="588" height="84" rx="18" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="64" y="532" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="24">Rajesh Sharma</text>
    
    <!-- Auto-suggest Card below -->
    <rect x="40" y="580" width="588" height="150" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="90" cy="655" r="32" fill="#3b82f6"/>
    <text x="78" y="664" fill="#fff" font-family="'Inter', sans-serif" font-weight="700" font-size="24">RS</text>
    <text x="140" y="635" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="22">Rajesh Sharma</text>
    <text x="140" y="664" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">VP DevOps &#183; Engineering Lead</text>
    <rect x="140" y="680" width="130" height="32" rx="10" fill="#064e3b"/>
    <text x="154" y="702" fill="#34d399" font-family="'Inter', sans-serif" font-weight="700" font-size="14">&#9679; AT DESK 4B</text>

    <!-- Input 4: Purpose -->
    <text x="40" y="780" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="18">PURPOSE OF VISIT</text>
    <rect x="40" y="800" width="588" height="84" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="64" y="852" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22">Q4 Architecture Strategy Review</text>

    <!-- Compliance Pill -->
    <rect x="40" y="930" width="588" height="90" rx="18" fill="#141c2e" stroke="#25354e"/>
    <text x="70" y="968" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="600" font-size="17">&#10003; NDA &amp; Security Policy Accepted</text>
    <text x="70" y="995" fill="#64748b" font-family="'Inter', sans-serif" font-size="14">ISO 27001 Compliant Audit Logging Enabled</text>

    <!-- Continue Button -->
    <rect x="40" y="1240" width="588" height="96" rx="28" fill="url(#coralG)"/>
    <text x="210" y="1298" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Next: Live Selfie &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>