<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1688" width="780" height="1688" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1626"/>
      <stop offset="100%" stop-color="#141c2e"/>
    </linearGradient>
    <linearGradient id="coralG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05d49"/>
      <stop offset="100%" stop-color="#ff8c69"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="1688" fill="url(#bgG)"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="390" cy="180" r="300" fill="#f05d49" opacity="0.08" filter="blur(40px)"/>

  <!-- Status Bar -->
  <g transform="translate(56, 50)">
    <text x="0" y="24" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="22" letter-spacing="0.5">09:21</text>
    <g transform="translate(570, 8)">
      <!-- Signal -->
      <rect x="0" y="8" width="4" height="14" rx="2" fill="#fff"/>
      <rect x="7" y="5" width="4" height="17" rx="2" fill="#fff"/>
      <rect x="14" y="2" width="4" height="20" rx="2" fill="#fff"/>
      <rect x="21" y="0" width="4" height="22" rx="2" fill="#fff"/>
      <!-- Battery -->
      <rect x="42" y="2" width="38" height="20" rx="6" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="46" y="6" width="28" height="12" rx="3.5" fill="#22c55e"/>
      <rect x="82" y="8" width="3" height="8" rx="1.5" fill="#fff"/>
    </g>
  </g>

  <!-- App Header -->
  <g transform="translate(56, 110)">
    <rect width="52" height="52" rx="16" fill="#f05d49" filter="url(#softShadow)"/>
    <path d="M18 26 L23 32 L34 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="70" y="28" fill="#ffffff" font-family="'Inter Tight', 'Inter', sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5">Lobby QR Scan</text>
    <text x="70" y="48" fill="#f05d49" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="2">NORMAL VISITOR &#183; STEP 1</text>
  </g>

  <!-- Content -->
  
  <g transform="translate(56, 200)">
    <!-- Main Card -->
    <rect width="668" height="1380" rx="28" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Camera Viewfinder -->
    <rect x="40" y="50" width="588" height="620" rx="24" fill="#0b101d" stroke="#334155" stroke-width="2"/>
    <circle cx="334" cy="360" r="140" fill="none" stroke="#f05d49" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>
    
    <!-- Viewfinder Corners -->
    <path d="M80 110 L140 110 M80 110 L80 170" stroke="#f05d49" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M588 110 L528 110 M588 110 L588 170" stroke="#f05d49" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M80 610 L140 610 M80 610 L80 550" stroke="#f05d49" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M588 610 L528 610 M588 610 L588 550" stroke="#f05d49" stroke-width="5" stroke-linecap="round" fill="none"/>
    
    <!-- QR Code Mockup in viewfinder -->
    <g transform="translate(234, 260)">
      <rect width="200" height="200" rx="16" fill="#ffffff"/>
      <rect x="20" y="20" width="50" height="50" fill="#0f172a"/>
      <rect x="30" y="30" width="30" height="30" fill="#ffffff"/>
      <rect x="35" y="35" width="20" height="20" fill="#0f172a"/>
      <rect x="130" y="20" width="50" height="50" fill="#0f172a"/>
      <rect x="140" y="30" width="30" height="30" fill="#ffffff"/>
      <rect x="145" y="35" width="20" height="20" fill="#0f172a"/>
      <rect x="20" y="130" width="50" height="50" fill="#0f172a"/>
      <rect x="30" y="140" width="30" height="30" fill="#ffffff"/>
      <rect x="35" y="145" width="20" height="20" fill="#0f172a"/>
      <rect x="90" y="30" width="20" height="40" fill="#0f172a"/>
      <rect x="90" y="90" width="30" height="30" fill="#f05d49"/>
      <rect x="140" y="90" width="40" height="20" fill="#0f172a"/>
      <rect x="90" y="140" width="30" height="40" fill="#0f172a"/>
      <rect x="140" y="140" width="30" height="30" fill="#0f172a"/>
    </g>

    <!-- Scan Line -->
    <line x1="80" y1="360" x2="588" y2="360" stroke="#f05d49" stroke-width="3" stroke-linecap="round"/>

    <!-- Detected Banner -->
    <rect x="70" y="710" width="528" height="76" rx="20" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
    <circle cx="110" cy="748" r="16" fill="#10b981"/>
    <path d="M104 748 L108 752 L116 744" stroke="#fff" stroke-width="3" fill="none"/>
    <text x="140" y="744" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Reception Desk QR Detected</text>
    <text x="140" y="768" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="15">vms.internal/lobby-gate-01</text>

    <!-- Instructions -->
    <text x="40" y="850" fill="#ffffff" font-family="'Inter Tight', sans-serif" font-weight="800" font-size="34">Touchless Self Check-In</text>
    <text x="40" y="890" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="20">Scan the front desk QR to open registration on your phone. No physical registers, zero waiting.</text>

    <!-- Feature Chips -->
    <rect x="40" y="950" width="280" height="54" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="984" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="18">&#10003; Zero App Install</text>
    
    <rect x="340" y="950" width="288" height="54" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="360" y="984" fill="#e2e8f0" font-family="'Inter', sans-serif" font-weight="600" font-size="18">&#10003; Instant Ingress</text>

    <!-- Action Button -->
    <rect x="40" y="1220" width="588" height="96" rx="28" fill="url(#coralG)"/>
    <text x="210" y="1278" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="26">Tap to Register &#8594;</text>
  </g>


  <!-- Home Indicator -->
  <rect x="250" y="1650" width="280" height="6" rx="3" fill="#ffffff" opacity="0.35"/>
</svg>